services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: laravel
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "laravel"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  database:
