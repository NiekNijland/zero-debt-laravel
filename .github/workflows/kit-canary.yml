name: Kit canary

on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      database:
        image: postgres:17
        env:
          POSTGRES_USER: laravel
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: laravel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laravel"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Check out the starter, with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - name: Read the pinned kit repository
        id: pin
        timeout-minutes: 2
        run: |
          read -r pin < .zero-debt-kit-version
          [[ "$pin" =~ ^([A-Za-z0-9._-]+/[A-Za-z0-9._-]+)@([0-9a-f]{40})$ ]]
          echo "repository=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Check out the kit's default branch next to the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          repository: ${{ steps.pin.outputs.repository }}
          path: kit-main
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        timeout-minutes: 10
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pcov
          coverage: pcov
          tools: composer:2.9
      - name: Install from the lock file
        timeout-minutes: 10
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Compare the scripts with the kit's default branch
        timeout-minutes: 5
        run: |
          test -f kit-main/tools/doctor.sh || { echo "The kit at kit-main has no tools/doctor.sh" >&2; exit 1; }
          status=0
          bash kit-main/tools/doctor.sh --project "$PWD" > doctor-report.txt || status=$?
          { echo '## Drift against the kit default branch'; echo; echo '```text'; cat doctor-report.txt; echo '```'; echo; echo "Doctor exit status: $status"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Put the kit's scripts in the workspace, keeping the project's config
        timeout-minutes: 5
        run: bash kit-main/tools/doctor.sh --project "$PWD" --upgrade-plan --apply
      - name: Put the project's own task lines of checks.sh back
        timeout-minutes: 2
        run: |
          # The doctor keeps the commands of the tasks the kit has and drops the others, while PARTS still names them (kit finding P3-11).
          git show HEAD:scripts/checks.sh | grep -E '^    "[A-Za-z][A-Za-z ]*::' | while IFS= read -r line; do
            name="${line#    \"}"
            name="${name%%::*}"
            if grep -qF "\"$name::" scripts/checks.sh; then continue; fi
            awk -v add="$line" '/^    "Guard tests::/ && done != 1 { print add; done = 1 } { print }' scripts/checks.sh > checks.tmp
            mv checks.tmp scripts/checks.sh
          done
      - name: Prove the ratchet rows against the kit's script
        timeout-minutes: 10
        run: bash scripts/ci-ratchets.sh --self-test
      - name: Count every ratchet row with the kit's script
        timeout-minutes: 10
        run: bash scripts/ci-ratchets.sh --head
      - name: Run the dashboard with the kit's script
        timeout-minutes: 15
        run: bash scripts/debt-dashboard.sh --final --offline --details
      - name: Run the static checks with the kit's scripts
        timeout-minutes: 20
        run: bash scripts/checks.sh --main --part static
      - name: Run the guard tests with the kit's scripts
        timeout-minutes: 20
        run: bash scripts/checks.sh --main --part guards
      - name: Keep the drift report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: kit-canary-report
          path: doctor-report.txt
          if-no-files-found: ignore
